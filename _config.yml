# Site settings
title: Jack Harter - DevOps Engineer
description: DevOps and Linux Engineer portfolio showcasing professional experience, skills, and projects
author: Jack Harter
email: jack.harter.8@gmail.com
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://j.hartr.net" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
permalink: pretty

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs/
  - .vscode/
  - .git/
  - .github/
  - README.md

# GitHub Pages compatibility
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Site navigation
navigation:
  - title: Home
    url: /
  - title: About
    url: /pages/about/
  - title: Projects
    url: /pages/projects/
  - title: Uses
    url: /pages/uses/
  - title: Resume
    url: /pages/resume/
  - title: Contact
    url: /pages/contact/

# Social links
social:
  github: jharter1
  linkedin: jwharter
  blog: https://blog.hartr.net
  hackernews: jhartr
  linktree: jackharter
